services:
  app:
    build: .
    image: codex-gcp:latest
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # All values below are supplied from a local .env file (see .env.example).
      # Never hardcode secrets or environment-specific endpoints here.
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME}
      - GCP_OAUTH_CLIENT_ID=${GCP_OAUTH_CLIENT_ID}
      - GCP_OAUTH_CLIENT_SECRET=${GCP_OAUTH_CLIENT_SECRET}
      - GCP_OAUTH_REDIRECT_URI=${GCP_OAUTH_REDIRECT_URI:-http://localhost:8000/gcp-oauth-callback}
      # assessment output / coverage (optional, see .env.example)
      - ASSESSMENT_OUTPUT_DIR=${ASSESSMENT_OUTPUT_DIR:-/app/data}
      - MASK_USERNAMES=${MASK_USERNAMES:-true}
      - ENABLE_DIAGNOSTIC_SETTINGS=${ENABLE_DIAGNOSTIC_SETTINGS:-true}
      - MAX_DIAGNOSTIC_RESOURCES=${MAX_DIAGNOSTIC_RESOURCES:-1500}
      - DIAGNOSTIC_WORKERS=${DIAGNOSTIC_WORKERS:-8}
      - ENABLE_POLICY=${ENABLE_POLICY:-true}
      - ENABLE_LOCKS=${ENABLE_LOCKS:-true}
      - ENABLE_DEFENDER=${ENABLE_DEFENDER:-true}
      - ENABLE_BACKUP=${ENABLE_BACKUP:-true}
    volumes:
      # Mount the current directory to /app/data so generated files persist locally if needed
      # Note: The app currently writes to the current working directory.
      # In Docker, this is /app.
      - ./data:/app/data
